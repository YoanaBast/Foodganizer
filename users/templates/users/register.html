{% load static %}
{% load compress %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    {% compress css %}
        <link rel="stylesheet" href="{% static 'css/main/styles.css' %}">
        <link rel="stylesheet" href="{% static 'css/homepage_styles.css' %}">
        <link rel="stylesheet" href="{% static 'css/main/auth.css' %}">
        <link rel="stylesheet" href="{% static 'css/main/interactive_fields.css' %}">
    {% endcompress %}

</head>
<body>

<main style="margin-top: 10rem">
    <div class="double-trouble">
        <div class="creds-form">
            <div class="creds-form-inner">
                <form method="post" novalidate>
                    {% csrf_token %}

                    {% for field in form %}
                        <div class="form-group">
                            {{ field.label_tag }}
                            {{ field }}
                            {{ field.errors }}
                        </div>
                    {% endfor %}

                    {{ form.non_field_errors }}

                    <button type="submit" class="btn">Register</button>
                </form>

                <p>
                    Already have an account? <a href="{% url 'login' %}">Login here</a>
                </p>
            </div>
        </div>

        <div class="hero-logo">
            <img src="{% static 'images/circle-logo.svg' %}" alt="foodganizer-logo">
        </div>

    </div>
</main>

</body>
</html>
