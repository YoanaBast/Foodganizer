{% load static %}
{% load compress %}

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Log in</title>

        {% compress css %}
            <link rel="stylesheet" href="{% static 'css/main/styles.css' %}">
            <link rel="stylesheet" href="{% static 'css/homepage_styles.css' %}">
            <link rel="stylesheet" href="{% static 'css/main/auth.css' %}">
            <link rel="stylesheet" href="{% static 'css/main/interactive_fields.css' %}">
        {% endcompress %}

        <!-- Favicon -->
        <link rel="icon" type="image/x-icon" href="{% static 'favicon/favicon.ico' %}">
    </head>
    <body>

    <main style="margin-top: 10rem">
        <div class="double-trouble">
            <div class="creds-form">
                    <div>
                        <form method="post" novalidate>
                            {% csrf_token %}

                            <div class="form-group">
                                {{ form.username.label_tag }}
                                {{ form.username }}
                            </div>

                            <div class="form-group">
                                {{ form.password.label_tag }}
                                {{ form.password }}
                            </div>

                            {{ form.non_field_errors }}

                            <button type="submit" class="btn">Login</button>
                        </form>

                        <p>
                            Don't have an account? <a href="{% url 'register' %}">Register here</a>
                        </p>

                    </div>

              </div>

              <div class="hero-logo">
                <img src="{% static 'images/circle-logo.svg' %}" alt="foodganizer-logo">
              </div>

        </div>

    </main>




    </body>
</html>
