services:

  redis:
    image: redis:7-alpine
    expose:
      - "6379"

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn meals_manager.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - ./logs:/app/logs
    depends_on:
      - redis
    expose:
      - "8000"
    env_file:
      - .env

  nginx:
    image: nginx
    ports:
      - "81:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/usr/share/nginx/html/static_files
      - ./media:/usr/share/nginx/html/media
    depends_on:
      - web

  celery:
    build: .
    command: celery -A meals_manager worker --loglevel=info
    volumes:
      - .:/app
      - ./logs:/app/logs
    env_file:
      - .env
    depends_on:
      - redis

  celery-beat:
    build: .
    command: celery -A meals_manager beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis

volumes:
  static_volume: