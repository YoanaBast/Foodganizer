services:

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    mem_limit: 64m
    command: redis-server --maxmemory 48mb --maxmemory-policy allkeys-lru

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn meals_manager.wsgi:application --bind 0.0.0.0:8000 --workers 1"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - ./logs:/app/logs
    depends_on:
      - redis
    expose:
      - "8000"
    env_file:
      - .env
    mem_limit: 200m

  nginx:
    image: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/usr/share/nginx/html/static_files
      - ./media:/usr/share/nginx/html/media
    depends_on:
      - web
    mem_limit: 32m

  celery:
    build: .
    command: celery -A meals_manager worker --loglevel=info --concurrency=1
    volumes:
      - .:/app
      - ./logs:/app/logs
    env_file:
      - .env
    depends_on:
      - redis
    mem_limit: 200m

  celery-beat:
    build: .
    command: celery -A meals_manager beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
    mem_limit: 100m

volumes:
  static_volume: