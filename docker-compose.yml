services:
  # The Django application service
  web:
    build: .  # Build the image from the Dockerfile in the current directory
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn meals_manager.wsgi:application --bind 0.0.0.0:8000"
    # run migrations, collectstatic, then start Gunicorn

    volumes:
      - .:/app  # Mount the entire project into the container so code changes reflect
      - static_volume:/app/staticfiles  # named volume so collectstatic isn't overwritten
      - ./logs:/app/logs  # logging persists on host

    expose:
      - "8000"  # Expose port 8000 to other containers (NOT to your browser, only nginx talks to this)
    env_file:
      - .env  # Load environment variables from .env (DB credentials, SECRET_KEY, etc.)
    depends_on:
      - db  # Don't start web until the database container is up

  # The PostgreSQL database service
  db:
    image: postgres:15  # Use the official PostgreSQL image, no Dockerfile needed
    env_file:
      - .env  # Postgres reads POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD from here
    volumes:
      # Mount a named volume to persist database data between container restarts
      # Without this, all data is lost every time the container is removed
      - postgres_data:/var/lib/postgresql/data

  # The Nginx reverse proxy service
  nginx:
    image: nginx  # Use the official Nginx image, no Dockerfile needed
    ports:
      - "81:80"  # Map port 81 on your machine to port 80 inside the container (visit localhost:81)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf  # Use your custom nginx config instead of the default
      - static_volume:/usr/share/nginx/html/static_files  # same named volume as web
      - ./media:/usr/share/nginx/html/media  # Give nginx access to media files (user uploads)
    depends_on:
      - web  # Don't start nginx until the Django/Gunicorn container is up

# Top-level volumes block — Docker manages these independently from containers
# Data survives: docker-compose down, docker-compose restart
# Data is ONLY lost if you run: docker-compose down -v  ⚠️
volumes:
  postgres_data:
  static_volume:  # shared between web and nginx for static files

