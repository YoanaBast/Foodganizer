{% load static %}

<script src="{% static 'js/navbarDropdownHandler.js' %}" defer></script>

<header>
    <div class="tab-nav">

        <div class="tab-buttons-container">

            <div class="tab-dropdown">
                <button class="tab-button">
                    Create
                </button>

                <div class="dropdown-menu">
                    <a href="{% url 'manage_ingredients' %}">Manage Ingredients</a>
                    <a href="{% url 'manage_recipes' %}">Manage Recipes</a>

                </div>
            </div>

            <div class="tab-dropdown">
                <button class="tab-button">
                    Cook
                </button>

                <div class="dropdown-menu">
                    <a href="{% url 'meal_suggestions' %}">Get Meal Ideas</a>
                    <a href="{% url 'generate_grocery_list' %}">Get Grocery List</a>
                    <a href="{% url 'manage_fridge' %}">Manage Fridge</a>
                    <a href="{% url 'meal_list' %}">Meals List</a>
                    <a href="{% url 'user_grocery_list' %}">Grocery List</a>

                </div>
            </div>

            <div class="tab-dropdown">
                <button class="tab-button">
                    Track
                </button>

                <div class="dropdown-menu">
                    <a href="{% url 'biometrics' %}" >BioMetrics</a>
                    <a href="{% url 'calorie-tracker' %}" >KCALendar</a>

                </div>
            </div>

        </div>

        <div class="logo">
            <a href="{% url 'homepage' %}">
                <img class="header-logo" src="{% static 'images/simple_logo.svg' %}" alt="logo"/>

            </a>
        </div>

{% if request.user.is_authenticated %}
    <div class="nav-links">

        <a href="{% url 'profile' %}" class="nav-user-icon">
            <i class="fa-solid fa-user"></i>
        </a>

        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="nav-logout-icon">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        </form>

    </div>

{% else %}
    <div class="nav-links">

        <li>
            <a href="{% url 'login' %}" class="nav-login-icon">
                <i class="fa-solid fa-right-to-bracket"></i>
            </a>
        </li>

        <li>
            <a href="{% url 'register' %}" class="nav-register-icon">
                <i class="fa-solid fa-user-plus"></i>
            </a>
        </li>

    </div>
{% endif %}



    </div>
</header>
