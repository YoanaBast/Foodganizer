{% load static %}

<div id="quick-add-modal" class="delete-modal">
    <div class="form-group recipe-modal-content">
        <h3 id="modal-title">Add New</h3>
        <div id="modal-fields"></div>
        <div id="modal-error" style="color:#ff6b6b; margin-bottom:0.75rem; display:none;"></div>
        <div style="display:flex; gap:0.5rem; justify-content:flex-end;">
            <button class="btn-mint-small" onclick="submitQuickModal()">Save</button>
            <button class="btn-wine-small" onclick="closeQuickModal()">Cancel</button>

        </div>
    </div>
</div>

<script src="{% static 'js/crud/_quick_add_modal.js' %}"></script>
