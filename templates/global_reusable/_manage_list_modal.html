{% load static %}

<div id="manageListModal" class="modal-overlay">
    <div class="form-group" style="background: var(--ivory); border-radius: 0.5rem; padding: 1.5rem; max-width: 480px; margin: 0 auto;">
        <h3 id="manageListTitle" style="margin-bottom:1rem; margin-top:0;"></h3>

        <!-- feedback message -->
        <div id="manageListMsg" style="display:none; padding:0.4rem 0.75rem; border-radius:4px; margin-bottom:0.75rem; font-size:0.9rem;"></div>

        <!-- inline edit bar (supports multiple fields) -->
        <div id="manageListEdit" style="display:none; background: var(--bg-gray); border:1px solid var(--bg-secondary-green); border-radius:6px; padding:0.75rem; margin-bottom:0.75rem;">
            <p style="margin:0 0 0.5rem 0; font-size:0.85rem; color:#4A4A4A;">Editing:</p>
            <div id="manageListEditFields"></div>
            <div style="display:flex; gap:0.5rem; margin-top:0.5rem;">
                <button class="btn-mint-small" onclick="confirmEditYes()">Save</button>
                <button class="btn-wine-small" onclick="confirmEditNo()">Cancel</button>

            </div>
        </div>

        <!-- inline confirm bar -->
        <div id="manageListConfirm" style="display:none; background: var(--bg-gray); border:1px solid var(--wine); border-radius:6px; padding:0.75rem; margin-bottom:0.75rem;">
            <p id="manageListConfirmMsg" style="margin:0 0 0.5rem 0; font-size:0.9rem;"></p>
            <div style="display:flex; gap:0.5rem;">
                <button class="btn-wine-small" onclick="confirmDeleteYes()">Delete</button>
                <button class="btn-mint-small" onclick="confirmDeleteNo()">Cancel</button>
            </div>
        </div>

        <div id="manageListItems" style="max-height:300px; overflow-y:auto; margin-bottom:1rem;"></div>

        <button class="btn-wine-small" onclick="closeManageModal()">Close</button>
    </div>
</div>

<script src="{% static 'js/_manage_list_modal.js' %}"></script>
