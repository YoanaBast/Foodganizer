{% load static %}
{% load core_filters %}

<div id="addFridgeItemModal" class="recipe-modal" style="display:none;">
    <div class="recipe-modal-content">
        <h4>Add to Fridge</h4>

        <form id="addFridgeItemForm" method="post" action="{% url 'add_fridge_item' %}" novalidate>
            {% csrf_token %}
            {% include "messages/errors_label.html" %}

            <label>Ingredient</label>
            <div class="searchable-select" id="fridgeIngredientDropdown">
                <input type="text" id="fridgeIngredientSearch" placeholder="Search ingredient..."
                       autocomplete="off"
                       oninput="filterFridgeIngredients()"
                       onfocus="openFridgeDropdown()">
                <div class="searchable-options" id="fridgeIngredientOptions">
                    <div class="search-option" data-value="" data-units="[]">Select ingredient</div>
                    {% for ing in ingredients %}
                    <div class="search-option"
                         data-value="{{ ing.id }}"
                         data-units='[{% for rel in ing.measurement_units.all %}{"id":"{{ rel.unit.id }}","name":"{{ rel.unit.name_singular|escapejs }}"}{% if not forloop.last %},{% endif %}{% endfor %}]'>
                        {{ ing.name|title_except }}
                    </div>
                    {% endfor %}
                </div>
                <input type="hidden" id="fridgeIngredientSelect" name="ingredient_id">
            </div>

            <label for="quantityInput">Quantity</label>
            <input type="number" id="quantityInput" name="quantity" step="0.01" min="0.01" placeholder="Quantity">

            <label for="unitSelect">Unit</label>
            <select id="unitSelect" name="unit"></select>

            <div class="mt-6">
                <button class="filter-submit" type="submit">Add to Fridge</button>
                <button class="filter-submit" type="button" onclick="closeModal()">Cancel</button>
            </div>
        </form>
    </div>
</div>


<script>
    function openFridgeDropdown() {
    document.getElementById('fridgeIngredientOptions').classList.add('open');
}

function filterFridgeIngredients() {
    const filter = document.getElementById('fridgeIngredientSearch').value.toLowerCase();
    document.querySelectorAll('#fridgeIngredientOptions .search-option').forEach(opt => {
        opt.style.display = !filter || opt.textContent.toLowerCase().includes(filter) ? '' : 'none';
    });
    openFridgeDropdown();
}

function selectFridgeIngredient(opt) {
    document.getElementById('fridgeIngredientSearch').value = opt.textContent.trim();
    document.getElementById('fridgeIngredientSelect').value = opt.dataset.value;
    document.getElementById('fridgeIngredientOptions').classList.remove('open');

    const units = JSON.parse(opt.dataset.units || '[]');
    const unitSelect = document.getElementById('unitSelect');
    unitSelect.innerHTML = units.map(u =>
        `<option value="${u.id}">${u.name}</option>`
    ).join('');
}

document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('#fridgeIngredientOptions .search-option').forEach(opt => {
        opt.addEventListener('click', () => selectFridgeIngredient(opt));
    });

    document.addEventListener('click', e => {
        if (!e.target.closest('#fridgeIngredientDropdown')) {
            document.getElementById('fridgeIngredientOptions').classList.remove('open');
        }
    });
});
</script>
