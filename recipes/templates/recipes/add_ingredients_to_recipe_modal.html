{% load static %}

<div id="ingredientModal" class="recipe-modal" style="padding: 0 1rem;">
    <div class="recipe-modal-content">
        <h2 class="section-title ranchers-regular">Add Ingredient</h2>
        {% include "messages/errors_label.html" %}

        <div class="searchable-select mb-6" id="ingredientDropdown">
            <input type="text" id="ingredientSearch" placeholder="Search ingredient..." autocomplete="off"
                   oninput="filterIngredients()" onfocus="filterIngredients()">
            <div class="searchable-options" id="ingredientOptions">
                <div class="search-option" data-value="" data-units="[]">Select ingredient</div>
                {% for ing in ingredients %}
                <div class="search-option"
                     data-value="{{ ing.id }}"
                     data-units='[{% for mu in ing.measurement_units.all %}{"id":"{{ mu.id }}","name":"{{ mu.name_for_quantity_singular }}"}{% if not forloop.last %},{% endif %}{% endfor %}]'>
                    {{ ing.name }}
                </div>
                {% endfor %}
            </div>
            <input type="hidden" id="ingredientSelect">
        </div>

        <div class="mb-6">
            <input type="number" id="quantityInput" name="quantity" step="0.01" min="0.01" placeholder="Quantity">
        </div>

        <div class="mb-6">
            <select id="unitSelect"></select>
        </div>

        <div style="margin-top: 1rem;">
            <button type="button" class="btn-mint-small" onclick="addIngredient()">Add</button>
            <button type="button" class="btn-wine-small" onclick="closeModal()">Cancel</button>
        </div>
    </div>
</div>
