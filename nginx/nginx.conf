user nginx;
worker_processes auto;

events {
    worker_connections 1024;  # Maximum simultaneous connections
}

http {
    include mime.types;  # So nginx knows .css is text/css, .js is application/javascript, etc.
    default_type application/octet-stream;

    server {
        listen 80;  # Listen on port 80 (maps to 81 on your machine via docker-compose)
        server_name localhost;  # Change to domain when deploying

        client_max_body_size 10M;  # default is 1MB

        # custom 413 page
        error_page 413 /errors/413.html;

        location = /errors/413.html {
            root /usr/share/nginx/html/static_files;  # looks for /usr/share/nginx/html/static_files/errors/413.html
            internal;  # only accessible internally, not directly by browser
        }

        # Serve static files directly without touching Django
        location /static/ {
            alias /usr/share/nginx/html/static_files/;
        }

        # Serve media files (user uploads) directly
        location /media/ {
            alias /usr/share/nginx/html/media/;
        }

        # Forward everything else to Gunicorn/Django
        location / {
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}