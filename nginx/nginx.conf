user nginx;
worker_processes auto;

events {
    worker_connections 1024;  # Maximum simultaneous connections
}

http {
    include mime.types;  # So nginx knows .css is text/css, .js is application/javascript, etc.
    default_type application/octet-stream;

    server {
        listen 80;  # Listen on port 80 (maps to 81 on your machine via docker-compose)
        server_name localhost;  # Change to  domain when deploying

        # Serve static files directly without touching Django
        location /static/ {
            alias /usr/share/nginx/html/static_files/;  # Must match the volume path in docker-compose
        }

        # Serve media files (user uploads) directly
        location /media/ {
            alias /usr/share/nginx/html/media/;
        }

        # Forward everything else to Gunicorn/Django
        location / {
            proxy_pass http://web:8000;  # 'web' is the service name in docker-compose
            proxy_set_header Host $host;  # Pass the original host header
            proxy_set_header X-Real-IP $remote_addr;  # Pass the real client IP
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # Pass proxy chain
            proxy_set_header X-Forwarded-Proto $scheme;  # Pass http or https
        }
    }
}